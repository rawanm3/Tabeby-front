<div class="auth-container">
  <div class="auth-card">
    
    <!-- Header Section -->
    <div class="auth-header">
      <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="M15.5 9.5L12 13l-3.5-3.5"></path>
        <path d="M12 13v5"></path>
      </svg>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">
        Set a new password for your account <br />
        <strong>{{ email }}</strong>
      </p>
    </div>

    <!-- Reset Form -->
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- New Password Field -->
      <div class="input-field">
        <label for="newPassword" class="input-label">New Password</label>
        <div class="input-container" 
             [class.error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <circle cx="12" cy="16" r="1"></circle>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="password" 
            id="newPassword"
            formControlName="newPassword"
            placeholder="Enter new password"
            class="input-control"
            autocomplete="new-password"
          />
        </div>
        <!-- Validation Errors -->
        <div *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched" 
             class="validation-error">
          <span *ngIf="resetForm.get('newPassword')?.errors?.['required']">Password is required</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">
            Must be at least 8 characters
          </span>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="auth-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="auth-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="auth-button primary"
        [disabled]="resetForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Save New Password</span>
        <span *ngIf="isLoading" class="button-loader">
          <span class="loader-spinner"></span>
          Saving...
        </span>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div class="auth-footer">
      <p>Remembered your password? 
        <a routerLink="/login" class="auth-link">Back to Sign in</a>
      </p>
    </div>

  </div>
</div>
