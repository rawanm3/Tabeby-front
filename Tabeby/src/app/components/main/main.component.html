<app-home></app-home>
 <div class="contact-wrapper">
        <div class="contact-box">
            <!-- Left Info -->
            <div class="contact-info">
                <h2>Contact Us</h2>
                <p>16676 (normal call rate)</p>
                <p>From outside Egypt: <strong>+2 02 259 83 999</strong></p>

                <h3>Address</h3>
                <p>14 Osman Ibn Affan Street, behind the Military Academy - Heliopolis, Cairo</p>

                <h3>Email Us</h3>
                <p>customercare@vezeeta.com</p>

                <div class="social">
                    <i class="fab fa-x-twitter"></i>
                    <i class="fab fa-instagram"></i>
                    <i class="fab fa-facebook-f"></i>
                </div>
            </div>

            <!-- Right Form -->
            <div class="contact-form">
                <h2>Contact Us</h2>
                <p>We are happy to receive your inquiries and suggestions.</p>

                <form>
                    <div class="form-group">
                        <label>Full Name <span>*</span></label>
                        <input type="text" placeholder="Full Name" required />
                    </div>

                    <div class="form-group">
                        <label>Mobile Number <span>*</span></label>
                        <div class="phone-input">
                            <div class="country-code">
                                <img src="https://flagcdn.com/w20/eg.png" alt="Egypt flag" />
                                <span>+20</span>
                            </div>
                            <input type="text" placeholder="Enter mobile number" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address <span>*</span></label>
                        <input type="email" placeholder="example@domain.com" required />
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea placeholder="Write your message here"></textarea>
                    </div>

                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>
<app-footer></app-footer>
