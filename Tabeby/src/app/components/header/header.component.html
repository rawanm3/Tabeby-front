<header class="header">
  <nav class="navbar">
    <div class="nav-container">
      <!-- Logo/Brand -->
      <div class="nav-brand">
        <a routerLink="/" class="brand-link">
          <img src="assets/logo.png" alt="Logo" class="logo">
          <span class="brand-text">Tabeby</span>
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="nav-menu" [class.active]="isMenuOpen">
        <ul class="nav-list">
          <li class="nav-item">
            <a routerLink="/" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a routerLink="/contact-us" class="nav-link">Contact Us</a>
          </li>
          
          <!-- Links for authenticated users -->
          <ng-container *ngIf="currentUser; else guestLinks">
            <li class="nav-item">
              <a routerLink="/profile" class="nav-link">Profile</a>
            </li>
            <li class="nav-item">
              <a routerLink="/appointments" class="nav-link">Appointments</a>
            </li>
          </ng-container>

          <!-- Guest links -->
          <ng-template #guestLinks>
            <li class="nav-item">
              <a routerLink="/login" class="nav-link">Login</a>
            </li>
            <li class="nav-item">
              <a routerLink="/register" class="nav-link">Register</a>
            </li>
          </ng-template>
        </ul>
      </div>

      <!-- User Section -->
      <div class="nav-user">
        <ng-container *ngIf="currentUser; else authButtons">
          <div class="user-dropdown">
            <button class="user-btn" (click)="toggleMenu()">
              <span class="user-name">{{ currentUser.name }}</span>
              <img *ngIf="currentUser" src="assets/user-avatar.png" alt="User" class="user-avatar">
            </button>
            <div class="dropdown-menu" [class.show]="isMenuOpen">
              <a routerLink="/profile" class="dropdown-item">
                <i class="fas fa-user"></i> Profile
              </a>
              <a routerLink="/settings" class="dropdown-item">
                <i class="fas fa-cog"></i> Settings
              </a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item logout-btn" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
              </button>
            </div>
          </div>
        </ng-container>

        <ng-template #authButtons>
          <div class="auth-buttons">
            <a routerLink="/login" class="btn btn-login">Login</a>
            <a routerLink="/register" class="btn btn-register">Register</a>
          </div>
        </ng-template>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>
</header>
