<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="card p-4 shadow" style="width: 22rem;">
    <h3 class="mb-3 text-center">Forgot Password</h3>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="Enter your email">
        <div class="text-danger" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          Valid email is required
        </div>
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send OTP' }}
      </button>
    </form>
  </div>
</div>
