<div class="verify-container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Verify Your Email</h2>
      <p class="card-subtitle">We sent a verification code to <strong>{{ email }}</strong></p>
    </div>

    <div class="card-body">
      <form [formGroup]="verifyForm" (ngSubmit)="onVerify()" class="verify-form">
        <div class="form-group">
          <label for="otp-input" class="form-label">Verification Code</label>
          <input
            id="otp-input"
            type="text"
            formControlName="otp"
            placeholder="Enter your OTP code"
            class="form-control"
            [class.is-invalid]="verifyForm.get('otp')?.invalid && verifyForm.get('otp')?.touched"
            maxlength="6"
          />
          <div *ngIf="verifyForm.get('otp')?.invalid && verifyForm.get('otp')?.touched" class="invalid-feedback">
            <div *ngIf="verifyForm.get('otp')?.errors?.['required']">OTP is required</div>
            <div *ngIf="verifyForm.get('otp')?.errors?.['minlength']">OTP must be at least 4 characters</div>
            <div *ngIf="verifyForm.get('otp')?.errors?.['maxlength']">OTP cannot exceed 6 characters</div>
          </div>
        </div>

        <button 
          class="btn btn-primary verify-btn" 
          type="submit" 
          [disabled]="isLoading || verifyForm.invalid"
        >
          <span *ngIf="!isLoading">Verify Account</span>
          <span *ngIf="isLoading">
            <i class="spinner"></i> Verifying...
          </span>
        </button>
      </form>

      <div class="resend-section">
        <p>Didn't receive the code?</p>
        <button 
          class="btn btn-link" 
          (click)="onResendOtp()" 
          [disabled]="isLoading"
        >
          Resend OTP
        </button>
      </div>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      <i class="icon-success"></i> {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger">
      <i class="icon-error"></i> {{ errorMessage }}
    </div>
  </div>
</div>
