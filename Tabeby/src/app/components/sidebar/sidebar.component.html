<div class="sidebar">
  <h3>فلترة الأطباء</h3>

  <!-- البحث بالاسم -->
  <input 
    type="text" 
    placeholder="ابحث بالاسم"
    [(ngModel)]="filter.name"
    (input)="onFilterChange()" />

  <!-- التخصص -->
  <select [(ngModel)]="filter.specialty" (change)="onFilterChange()">
    <option value="">اختر التخصص</option>
    <option value="Cardiology">قلب</option>
    <option value="Dermatology">جلدية</option>
    <option value="Neurology">مخ وأعصاب</option>
  </select>

  <!-- المدينة -->
  <input 
    type="text" 
    placeholder="المدينة"
    [(ngModel)]="filter.city"
    (input)="onFilterChange()" />

  <!-- السعر -->
  <input 
    type="number" 
    placeholder="أقصى سعر"
    [(ngModel)]="filter.maxPrice"
    (input)="onFilterChange()" />

  <select [(ngModel)]="filter.gender" (change)="onFilterChange()">

    <option value="male">ذكر</option>
    <option value="female">أنثى</option>
  </select> -->

    <option value="">الكل</option>
    <option value="morning">صباحي</option>
    <option value="evening">مسائي</option>
  </select> -->

  <hr />

  <!-- عرض النتائج -->
  <div *ngIf="doctors.length > 0">
    <h4>النتائج:</h4>
    <ul>
      <li *ngFor="let doc of doctors">
        {{ doc.userId.fullName }} - {{ doc.specialty }} - {{ doc.location }} - {{ doc.price }} جنيه
      </li>
    </ul>
  </div>
  <div *ngIf="doctors.length === 0">
    <p>لا توجد نتائج مطابقة.</p>
  </div>
</div>
